name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Dependency install scripts run in this job, so it gets no write token and keeps none in .git.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
      - name: Check tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      # Unpacked-install zip (pinned extension ID) and Chrome Web Store zip (no manifest key).
      - run: pnpm zip && pnpm zip:store
      - name: Collect release files
        run: |
          mkdir release
          cp .output/*.zip release/
          for f in .output-store/*.zip; do cp "$f" "release/$(basename "${f%.zip}")-store.zip"; done
          cp CHANGELOG.md release/
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file release/CHANGELOG.md
